<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interview Scheduler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0a0a, #1b1b1b);
      color: white;
      padding: 20px;
    }

    .wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1200px;
    }

    /* Left section */
    .left {
      flex: 1;
      padding-right: 40px;
    }

    .left h1 {
      font-size: 60px;
      font-weight: 700;
      line-height: 1.2;
    }

    .left h2 {
      font-size: 22px;
      font-weight: 400;
      margin-top: 15px;
      color: #ccc;
      text-align: left;
    }

    /* Right form section */
    .right {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
    }

    /* Background card layering */
    .card-bg {
      position: absolute;
      width: 100%;
      max-width: 480px;
      height: 100%;
      border-radius: 20px;
      background: #2e2e2e;
      top: 20px;
      left: 20px;
      z-index: 0;
    }

    .card-bg:nth-child(2) {
      top: 40px;
      left: 40px;
      background: #3c3c3c;
    }

    /* Main form card */
    .container {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      z-index: 1;
      color: #000;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    h2 {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 25px;
      text-align: center;
    }

    label {
      font-size: 16px;
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="file"],
    input[type="time"],
    input[type="number"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .radio-group {
      margin-bottom: 20px;
      font-size: 15px;
    }

    .radio-group label {
      margin-right: 20px;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #5a2ccf, #7b3efc);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    @media (max-width: 900px) {
      .wrapper {
        flex-direction: column;
        text-align: center;
      }
      .left {
        padding: 0 0 30px 0;
      }
      .left h1 {
        font-size: 40px;
      }
      .left h2 {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Left big title -->
    <div class="left">
      <h1>Interview<br>Scheduler</h1>
      <h2>by <span class="auto-type"></span></h2>
    </div>

    <!-- Right form with layering -->
    <div class="right">
      <div class="card-bg"></div>
      <div class="card-bg"></div>
      <div class="container">
        <h2>Get Your Interviews Scheduled!</h2>
        <form method="post" enctype="multipart/form-data">
          <label for="excel_file">Upload Google Form Responses (Excel File)</label>
          <input type="file" name="excel_file" id="excel_file" required />

          <label for="start_time">Interview Start Time</label>
          <input type="time" name="start_time" id="start_time" required/>

          <label for="duration">Duration per interview (minutes)</label>
          <input type="number" name="duration" id="duration" min="1" required>

          <div class="radio-group">
            <label><input type="radio" name="schedule_type" value="separate_days" checked> On Separate Days</label>
            <label><input type="radio" name="schedule_type" value="same_day"> On Same Day</label>
          </div>

          <button type="submit" class="btn">Generate PDFs + VCFs</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Typed.js auto-type effect -->
  <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
  <script>
    var typed = new Typed(".auto-type", {
        strings: ["Akshat Mishra", "Akshata Bakre"],
        typeSpeed: 120,
        backSpeed: 120,
        loop: true
    });
  </script>
</body>
</html>
