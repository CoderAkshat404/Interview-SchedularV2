<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Scheduler</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for background and font */
        body {
            font-family: 'Poppins', sans-serif;
            /* Using Flask's url_for for background image as per original code */
            background-image: url("{{ url_for('static', filename='bg.png') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Custom styling for file input button */
        input[type="file"]::file-selector-button {
            @apply bg-blue-700 text-white py-2 px-4 rounded-lg cursor-pointer transition-all duration-300 ease-in-out hover:bg-blue-800;
        }

        /* Webkit specific styles for file input button */
        input[type="file"]::-webkit-file-upload-button {
            @apply bg-blue-700 text-white py-2 px-4 rounded-lg cursor-pointer transition-all duration-300 ease-in-out hover:bg-blue-800;
        }

        /* Style for radio buttons */
        input[type="radio"] {
            /* Custom radio button appearance */
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            @apply w-5 h-5 border-2 border-white rounded-full bg-transparent cursor-pointer relative;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        input[type="radio"]:checked {
            @apply bg-amber-500 border-amber-500;
        }

        input[type="radio"]:checked::after {
            content: '';
            @apply absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-white rounded-full;
        }

        /* Placeholder color for inputs */
        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Background Overlay for better readability and depth -->
    <div class="absolute inset-0 bg-black bg-opacity-60 z-0"></div>

    <div class="relative z-10 w-11/12 max-w-3xl bg-white/10 backdrop-blur-md rounded-3xl p-8 md:p-12 shadow-2xl border border-white/20
                transition-all duration-500 ease-in-out hover:scale-[1.01] hover:shadow-3xl transform-gpu">
        <h2 class="text-4xl md:text-5xl font-extrabold text-white mb-8 text-center tracking-wide
                   transition-all duration-300 ease-in-out hover:scale-105 hover:text-amber-200">
            Get Your Interviews Scheduled!
        </h2>
        <form method="post" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label for="excel_file" class="block text-lg md:text-xl font-semibold text-white text-left mb-2
                                               transition-all duration-300 ease-in-out hover:scale-105 hover:text-amber-100">
                    Upload Google Form Responses (Excel File)
                </label>
                <input type="file" name="excel_file" id="excel_file" required
                       class="w-full p-3 rounded-lg bg-white/20 border border-white/30 text-white
                              focus:outline-none focus:ring-2 focus:ring-amber-400
                              transition-all duration-300 ease-in-out hover:bg-white/30 hover:scale-[1.01] text-base md:text-lg"/>
            </div>

            <div>
                <label for="start_time" class="block text-lg md:text-xl font-semibold text-white text-left mb-2
                                                transition-all duration-300 ease-in-out hover:scale-105 hover:text-amber-100">
                    Interview Start Time
                </label>
                <input type="time" name="start_time" id="start_time" required
                       class="w-full p-3 rounded-lg bg-white/20 border border-white/30 text-white
                              focus:outline-none focus:ring-2 focus:ring-amber-400
                              transition-all duration-300 ease-in-out hover:bg-white/30 hover:scale-[1.01] text-base md:text-lg"/>
            </div>

            <div>
                <label for="duration" class="block text-lg md:text-xl font-semibold text-white text-left mb-2
                                             transition-all duration-300 ease-in-out hover:scale-105 hover:text-amber-100">
                    Duration per interview (minutes)
                </label>
                <input type="number" name="duration" id="duration" min="1" required
                       class="w-full p-3 rounded-lg bg-white/20 border border-white/30 text-white
                              focus:outline-none focus:ring-2 focus:ring-amber-400
                              transition-all duration-300 ease-in-out hover:bg-white/30 hover:scale-[1.01] text-base md:text-lg"/>
            </div>
            
            <div class="radio-group text-left text-white text-lg md:text-xl space-y-3 md:space-x-6 md:space-y-0 flex flex-col md:flex-row items-start md:items-center">
                <label class="inline-flex items-center transition-all duration-300 ease-in-out hover:scale-105 hover:text-amber-100">
                    <input type="radio" name="schedule_type" value="separate_days" checked class="mr-2">
                    On Separate Days
                </label>
                <label class="inline-flex items-center transition-all duration-300 ease-in-out hover:scale-105 hover:text-amber-100">
                    <input type="radio" name="schedule_type" value="same_day" class="mr-2">
                    On Same Day
                </label>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-700 to-blue-900 text-white
                                         py-3 px-8 rounded-full text-xl md:text-2xl font-bold cursor-pointer shadow-lg
                                         hover:from-blue-800 hover:to-blue-950 hover:shadow-xl
                                         transition-all duration-300 ease-in-out hover:scale-105 active:scale-95 transform-gpu">
                Generate PDFs + VCFs
            </button>
        </form>
    </div>
</body>
</html>
